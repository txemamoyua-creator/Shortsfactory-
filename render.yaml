services:
  - type: web
    name: shortsfactory-api
    env: python
    pythonVersion: 3.11
    buildCommand: apt-get update && apt-get install -y libjpeg-dev libpng-dev zlib1g-dev libffi-dev freetype2-dev
    startCommand: gunicorn main:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
